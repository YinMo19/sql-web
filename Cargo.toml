[package]
name = "sql-web"
version = "0.2.1"
authors = ["YinMo19 <me@YinMo19.top>"]
edition = "2024"
description = "A web-based database browser for SQLite, MySQL, and PostgreSQL written in Rust using Axum, React, and SQLx."
homepage = "https://github.com/YinMo19/sql-web"
documentation = "https://docs.rs/sql-web"
repository = "https://github.com/YinMo19/sql-web"
license = "MIT"
readme = "README.md"
keywords = ["sql", "mysql", "sqlite", "pgsql", "axum"]
build = "build.rs"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "build.rs",
    "src/**",
    "frontend/dist/**",
]

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "any",
    "sqlite",
    "mysql",
    "postgres",
    "chrono",
    "uuid",
    "json",
] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
url = "2.0"
csv = "1.3"
futures = "0.3"
include_dir = "0.7"
mime_guess = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
codegen-units = 1
opt-level = 'z'
